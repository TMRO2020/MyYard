<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1f6b3a">
    <title>PERMA Navigation Sandbox 14A</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="navigation.css">
</head>
<body>
    <div id="map" aria-label="Hartă satelit pentru navigație"></div>

    <header class="topbar">
        <div>
            <strong>PERMA NAVIGATION</strong>
            <span>Sandbox 14A</span>
        </div>
        <button id="btn-locate" class="icon-button" type="button" aria-label="Pornește GPS">📍</button>
    </header>

    <section class="target-card" aria-label="Țintă navigație">
        <div class="target-title">🎯 ȚINTĂ</div>
        <div id="target-status" class="target-status">Alege un punct pe hartă.</div>
        <div class="target-actions">
            <button id="btn-pick" class="primary" type="button">Alege ținta pe hartă</button>
            <button id="btn-clear" class="secondary" type="button">Șterge</button>
        </div>
        <details class="coords-details">
            <summary>Introdu coordonatele țintei</summary>
            <div class="coords-grid">
                <input id="target-lat" type="number" step="any" inputmode="decimal" placeholder="Latitudine">
                <input id="target-lng" type="number" step="any" inputmode="decimal" placeholder="Longitudine">
            </div>
            <button id="btn-set-coords" class="secondary full" type="button">Setează ținta</button>
        </details>
    </section>

    <section id="navigation-card" class="navigation-card hidden" aria-label="Date navigație">
        <div class="nav-heading">
            <span id="nav-state">Aștept GPS…</span>
            <span id="gps-accuracy">Precizie —</span>
        </div>

        <div class="direction-area" aria-hidden="true">
            <div id="direction-arrow" class="direction-arrow">↑</div>
            <div class="direction-caption">direcția către țintă</div>
        </div>

        <div id="distance-value" class="distance-value">—</div>
        <div class="distance-label">distanță până la copac</div>

        <div class="xy-grid">
            <div><span>ΔX</span><strong id="delta-x">—</strong><small>Est + / Vest −</small></div>
            <div><span>ΔY</span><strong id="delta-y">—</strong><small>Nord + / Sud −</small></div>
            <div><span>Direcție</span><strong id="bearing-value">—</strong><small>bearing</small></div>
        </div>

        <div id="arrival-badge" class="arrival-badge">În drum spre țintă</div>
        <button id="btn-stop" class="stop-button" type="button">Oprește navigarea</button>
    </section>

    <section id="gps-card" class="gps-card">
        <div><strong>Poziția mea</strong><span id="gps-status">GPS oprit</span></div>
        <div class="gps-coords"><span id="current-lat">Lat —</span><span id="current-lng">Lng —</span></div>
    </section>

    <div id="pick-hint" class="pick-hint hidden">Atinge harta pentru a pune ținta.</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
