<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Permacultura & Microclimat - Design Peisagistic</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- SunCalc JS pentru calcule astronomice solare precise -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-glass: rgba(255, 255, 255, 0.93);
            --text-main: #1a251b;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Buton Hamburger Dreapta-Sus */
        .hamburger-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: var(--bg-glass);
            border: 1px solid rgba(0, 0, 0, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--text-main);
            position: relative;
            transition: all 0.3s ease;
        }

        .hamburger-btn span::before,
        .hamburger-btn span::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            transition: all 0.3s ease;
        }

        .hamburger-btn span::before { top: -7px; }
        .hamburger-btn span::after { top: 7px; }

        /* Sidebar Panou Lateral */
        .sidebar {
            position: absolute;
            top: 0;
            right: -360px;
            width: 320px;
            height: 100%;
            background: var(--bg-glass);
            z-index: 1001;
            box-shadow: -4px 0 25px rgba(0,0,0,0.2);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            padding: 24px 20px;
            overflow-y: auto;
            color: var(--text-main);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-color);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            line-height: 1;
            color: #666;
            cursor: pointer;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #555;
            margin: 16px 0 8px 0;
            font-weight: 700;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #fff;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            background-color: var(--primary-hover);
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #4b5563;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid #ccc;
        }

        /* Custom Toggles HTML */
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 0;
        }

        .toggle-group label {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Floating Tool Bar (Plantare Rapidă) */
        .toolbar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-glass);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(8px);
            max-width: 90vw;
        }

        .toolbar select {
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            padding-right: 8px;
        }

        /* Stil Pop-up Leaflet */
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius);
            padding: 4px;
            box-shadow: var(--shadow);
        }

        .tree-popup {
            min-width: 220px;
            font-size: 0.9rem;
        }

        .tree-popup h3 {
            color: var(--primary-color);
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        .tree-popup label {
            display: block;
            font-size: 0.8rem;
            color: #666;
            margin-top: 6px;
        }

        .tree-popup input {
            width: 100%;
            padding: 6px;
            margin-top: 2px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .knowledge-base {
            margin-top: 10px;
            padding: 8px;
            background-color: #f0f7f0;
            border-left: 3px solid var(--primary-color);
            border-radius: 4px;
            font-size: 0.78rem;
            color: #2d4a2e;
            line-height: 1.35;
        }

        .popup-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            flex: 1;
        }

        .btn-danger {
            background-color: #d32f2f;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Harta Principală -->
    <div id="map"></div>

    <!-- Buton Meniu Hamburger -->
    <div class="hamburger-btn" onclick="toggleSidebar()">
        <span></span>
    </div>

    <!-- Toolbar Plantare Selectie -->
    <div class="toolbar">
        <label for="species-select" style="font-size: 0.85rem; font-weight: bold; white-space: nowrap;">Plantează:</label>
        <select id="species-select">
            <option value="nuc">Nuc (Verde Închis)</option>
            <option value="cires">Cireș (Roz)</option>
            <option value="mar">Măr (Roșu)</option>
            <option value="conifere">Conifere (Albastru-Verde)</option>
        </select>
    </div>

    <!-- Sidebar Meniu Configurare -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Setări & Microclimat</h2>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>

        <!-- Pozitionare & GPS -->
        <div class="section-title">Poziționare</div>
        <button class="btn" onclick="getGPSLocation()">
            📍 Activează GPS
        </button>

        <div class="input-group">
            <input type="number" id="lat-input" step="any" placeholder="Latitudine">
            <input type="number" id="lng-input" step="any" placeholder="Longitudine">
        </div>
        <button class="btn btn-secondary" onclick="goToCustomCoords()">Mergi la coordonate</button>

        <!-- Favorit LocalStorage -->
        <div class="section-title">Locație Favorită</div>
        <div class="input-group">
            <button class="btn btn-outline" onclick="saveFavoriteLocation()">💾 Salvează Favorit</button>
            <button class="btn btn-outline" onclick="loadFavoriteLocation()">📂 Încarcă Favorit</button>
        </div>

        <!-- Overlays Microclimat -->
        <div class="section-title">Overlay Microclimat</div>
        <div class="toggle-group">
            <label for="solar-toggle">☀️ Strat Solar (Solstiții)</label>
            <label class="switch">
                <input type="checkbox" id="solar-toggle" onchange="toggleSolarLayer(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="toggle-group">
            <label for="wind-toggle">💨 Strat Vânturi Principale</label>
            <label class="switch">
                <input type="checkbox" id="wind-toggle" onchange="toggleWindLayer(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Import / Export -->
        <div class="section-title">Gestiune Proiect</div>
        <button class="btn btn-outline" onclick="exportProjectJSON()">📥 Salvează Proiect (JSON)</button>
        <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importProjectJSON(event)">
        <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">📤 Încarcă Proiect (JSON)</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. CONFIGURARE BAZĂ DE DATE ȘI PROPRIETĂȚI SPECII ---
        const SPECIES_CONFIG = {
            nuc: {
                name: "Nuc",
                color: "#1b5e20", // Verde Închis
                kb: "Tratamente: Cupru primăvara devreme. Toaletare: Doar la sfârșitul verii (august) pentru a evita pierderea masivă de sevă. Notă permacultură: Secretă juglonă, inhibă alte plante pe o rază egală cu coroana."
            },
            cires: {
                name: "Cireș",
                color: "#f48fb1", // Roz
                kb: "Tratamente: Tratamente la dezmugurit, post-floral. Toaletare: Tăieri în uscat (februarie-martie) pentru rodire sau imediat după recoltare."
            },
            mar: {
                name: "Măr",
                color: "#e53935", // Roșu
                kb: "Tratamente: Tratamente la dezmugurit, post-floral contra rapanului și viermelui merelor. Toaletare: Tăieri în uscat (februarie-martie) pentru aerisirea coroanei."
            },
            conifere: {
                name: "Conifere",
                color: "#00897b", // Albastru / Verde Teal
                kb: "Tratamente: Verificări periodice pentru acarieni și uscare interioară. Toaletare: Tunderi de structură primăvara. Acidifică solul din jur prin acele căzute."
            }
        };

        // Stare aplicație
        let map;
        let treeMarkers = [];
        let solarGroup = L.layerGroup();
        let windGroup = L.layerGroup();

        // Locație implicită (România - Centru)
        let currentCenter = [45.9432, 24.9668];

        // --- 2. INIȚIALIZARE HARTA LEAFLET ---
        function initMap() {
            // Verificare dacă există o locație favorită salvată
            const savedFav = localStorage.getItem('perma_fav_location');
            if (savedFav) {
                currentCenter = JSON.parse(savedFav);
            }

            // Inițializare hartă Leaflet optimizată pentru touch
            map = L.map('map', {
                zoomControl: false,
                tap: true
            }).setView(currentCenter, 18);

            // Adăugare strat Google Satelit la zoom maxim 20
            L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                maxNativeZoom: 19,
                attribution: '&copy; Google Maps'
            }).addTo(map);

            // Re-ancorare straturi pe event-uri de miscare
            map.on('move', updateMicroclimateLayers);

            // Event click pe hartă pentru plasare arbori
            map.on('click', function(e) {
                // Prevenim plasarea dacă s-a dat click pe un marker deja existent
                if (e.originalEvent.target.classList.contains('leaflet-interactive')) return;
                
                const selectedSpecies = document.getElementById('species-select').value;
                addTreeMarker(e.latlng.lat, e.latlng.lng, selectedSpecies);
            });

            // Încărcare dinamică inițială a microclimatului dacă opțiunile sunt bifate
            updateMicroclimateLayers();
        }

        // --- 3. MENIU & NAVIGATION ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function getGPSLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 19);
                    updateMicroclimateLayers();
                    toggleSidebar();
                }, function(error) {
                    alert("Eroare la obținerea locației GPS: " + error.message);
                }, { enableHighAccuracy: true });
            } else {
                alert("GPS-ul nu este suportat de browserul tău.");
            }
        }

        function goToCustomCoords() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                map.setView([lat, lng], 19);
                updateMicroclimateLayers();
                toggleSidebar();
            } else {
                alert("Te rugăm să introduci coordonate valide.");
            }
        }

        function saveFavoriteLocation() {
            const center = map.getCenter();
            localStorage.setItem('perma_fav_location', JSON.stringify([center.lat, center.lng]));
            alert("Locația a fost salvată ca favorită!");
        }

        function loadFavoriteLocation() {
            const savedFav = localStorage.getItem('perma_fav_location');
            if (savedFav) {
                const coords = JSON.parse(savedFav);
                map.setView(coords, 19);
                updateMicroclimateLayers();
                toggleSidebar();
            } else {
                alert("Nu există nicio locație favorită salvată.");
            }
        }

        // --- 4. GESTIUNE ARBORI (DRAG & DROP, POP-UP INTERACTIV) ---
        function addTreeMarker(lat, lng, speciesKey, data = null) {
            const species = SPECIES_CONFIG[speciesKey] || SPECIES_CONFIG.mar;
            
            // Creare iconiță rotundă colorată
            const customIcon = L.divIcon({
                className: 'custom-tree-marker',
                html: `<div style="
                    background-color: ${species.color};
                    width: 22px;
                    height: 22px;
                    border-radius: 50%;
                    border: 3px solid white;
                    box-shadow: 0 0 5px rgba(0,0,0,0.5);
                "></div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });

            // Proprietăți implicite sau încărcate din JSON
            const treeData = data || {
                id: Date.now(),
                speciesKey: speciesKey,
                height: 2.5,
                crownDiameter: 3.0,
                age: 2
            };

            // Marker configurat cu { draggable: true } pentru ajustare tactilă precisă
            const marker = L.marker([lat, lng], {
                icon: customIcon,
                draggable: true
            }).addTo(map);

            marker.treeData = treeData;

            // Pop-up interactiv
            bindTreePopup(marker);

            // Verificare analize mediu la final de drag
            marker.on('dragend', function(event) {
                const newPos = marker.getLatLng();
                analizeazaCompatibilitateMediu(newPos.lat, newPos.lng, marker);
                updateMicroclimateLayers();
            });

            treeMarkers.push(marker);
            analizeazaCompatibilitateMediu(lat, lng, marker);
        }

        function bindTreePopup(marker) {
            const data = marker.treeData;
            const species = SPECIES_CONFIG[data.speciesKey];

            const popupContent = `
                <div class="tree-popup">
                    <h3>${species.name}</h3>
                    <label>Înălțime curentă (m):</label>
                    <input type="number" id="pop-height-${data.id}" value="${data.height}" step="0.5" onchange="updateTreeData(${data.id})">
                    
                    <label>Diametru coroană (m):</label>
                    <input type="number" id="pop-crown-${data.id}" value="${data.crownDiameter}" step="0.5" onchange="updateTreeData(${data.id})">
                    
                    <label>Vârstă estimată (ani):</label>
                    <input type="number" id="pop-age-${data.id}" value="${data.age}" onchange="updateTreeData(${data.id})">

                    <div class="knowledge-base">
                        ${species.kb}
                    </div>

                    <div class="popup-actions">
                        <button class="btn-small btn-danger" onclick="deleteTree(${data.id})">Șterge</button>
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent);
        }

        function updateTreeData(id) {
            const marker = treeMarkers.find(m => m.treeData.id === id);
            if (marker) {
                marker.treeData.height = parseFloat(document.getElementById(`pop-height-${id}`).value) || 0;
                marker.treeData.crownDiameter = parseFloat(document.getElementById(`pop-crown-${id}`).value) || 0;
                marker.treeData.age = parseInt(document.getElementById(`pop-age-${id}`).value) || 0;
            }
        }

        function deleteTree(id) {
            const index = treeMarkers.findIndex(m => m.treeData.id === id);
            if (index !== -1) {
                map.removeLayer(treeMarkers[index]);
                treeMarkers.splice(index, 1);
            }
        }

        // --- 5. OVERLAYS MICROCLIMAT (SOLAR SI VÂNT) ---
        function toggleSolarLayer(enable) {
            if (enable) {
                solarGroup.addTo(map);
            } else {
                solarGroup.clearLayers();
                map.removeLayer(solarGroup);
            }
            updateMicroclimateLayers();
        }

        function toggleWindLayer(enable) {
            if (enable) {
                windGroup.addTo(map);
            } else {
                windGroup.clearLayers();
                map.removeLayer(windGroup);
            }
            updateMicroclimateLayers();
        }

        function updateMicroclimateLayers() {
            const center = map.getCenter();
            
            // Calcul și desenare Strat Solar dacă este activ
            if (map.hasLayer(solarGroup)) {
                solarGroup.clearLayers();

                // Calcul unghiuri astronomice folosind SunCalc
                const summerSolstice = new Date(new Date().getFullYear(), 5, 21); // 21 Iunie
                const winterSolstice = new Date(new Date().getFullYear(), 11, 21); // 21 Decembrie

                const summerSun = SunCalc.getTimes(summerSolstice, center.lat, center.lng);
                const winterSun = SunCalc.getTimes(winterSolstice, center.lat, center.lng);

                const summerSunrisePos = SunCalc.getPosition(summerSun.sunrise, center.lat, center.lng);
                const summerSunsetPos = SunCalc.getPosition(summerSun.sunset, center.lat, center.lng);
                const winterSunrisePos = SunCalc.getPosition(winterSun.sunrise, center.lat, center.lng);
                const winterSunsetPos = SunCalc.getPosition(winterSun.sunset, center.lat, center.lng);

                // Desenare linii solstiții ancorate geografic
                drawSolarRay(center, summerSunrisePos.azimuth, '#f59e0b', 'Răsărit Solstițiu Vară');
                drawSolarRay(center, summerSunsetPos.azimuth, '#d97706', 'Apus Solstițiu Vară');
                drawSolarRay(center, winterSunrisePos.azimuth, '#3b82f6', 'Răsărit Solstițiu Iarnă');
                drawSolarRay(center, winterSunsetPos.azimuth, '#1d4ed8', 'Apus Solstițiu Iarnă');
            }

            // Calcul și desenare Strat Vânt dacă este activ
            if (map.hasLayer(windGroup)) {
                windGroup.clearLayers();

                // Crivăț (NE / E - Iarnă rece)
                drawWindArrow(center, 45, '#1e3a8a', 'Crivăț (Vânt rece NE)');
                // Vânturi Calde (S / SV - Vară)
                drawWindArrow(center, 225, '#ef4444', 'Vânturi Calde (SV)');
            }
        }

        function drawSolarRay(center, azimuthRad, color, labelText) {
            const distance = 0.0008; // Distanță proiecție pe hartă (~80m)
            const destLat = center.lat + (distance * Math.cos(azimuthRad));
            const destLng = center.lng + (distance * Math.sin(azimuthRad));

            const line = L.polyline([[center.lat, center.lng], [destLat, destLng]], {
                color: color,
                weight: 3,
                dashArray: '6, 6',
                opacity: 0.85
            }).addTo(solarGroup);

            line.bindTooltip(labelText, { permanent: false, direction: 'top' });
        }

        function drawWindArrow(center, angleDegrees, color, labelText) {
            const rad = (angleDegrees - 90) * (Math.PI / 180);
            const distance = 0.0006;
            const destLat = center.lat + (distance * Math.sin(rad));
            const destLng = center.lng + (distance * Math.cos(rad));

            const line = L.polyline([[center.lat, center.lng], [destLat, destLng]], {
                color: color,
                weight: 4,
                opacity: 0.75
            }).addTo(windGroup);

            line.bindTooltip(labelText, { permanent: false, direction: 'center' });
        }

        // --- 6. SISTEM DE ALERTĂ DE MEDIU (PLACEHOLDER DEVOLTARI ULTERIOARE) ---
        /**
         * Funcție placeholder pentru analiza automată a compatibilității ecologice/permaculturale
         * @param {number} lat - Latitudinea copacului verificat
         * @param {number} lng - Longitudinea copacului verificat
         * @param {Object} currentMarker - Obiectul marker curent
         */
        function analizeazaCompatibilitateMediu(lat, lng, currentMarker) {
            // Exemplu structură placeholder pentru dezvoltări viitoare:
            // 1. Calcul distanțe față de alți arbori (ex: verificare juglonă Nuc)
            // 2. Calcul umbrire în funcție de înălțime și unghiul solar
            // 3. Verificare expunere la crivăț
            
            /* 
            treeMarkers.forEach(otherMarker => {
                if(otherMarker !== currentMarker) {
                    const dist = map.distance([lat, lng], otherMarker.getLatLng());
                    if (dist < 5 && currentMarker.treeData.speciesKey === 'nuc') {
                        console.warn("Atenție: Nuc plasat prea aproape de alți pomi!");
                    }
                }
            });
            */
        }

        // --- 7. EXPORT / IMPORT DATE PROIECT (JSON) ---
        function exportProjectJSON() {
            const exportData = {
                version: "1.0",
                timestamp: new Date().toISOString(),
                center: [map.getCenter().lat, map.getCenter().lng],
                zoom: map.getZoom(),
                trees: treeMarkers.map(m => ({
                    lat: m.getLatLng().lat,
                    lng: m.getLatLng().lng,
                    data: m.treeData
                }))
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `proiect_permacultura_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importProjectJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);

                    // Curățare markeri existenți
                    treeMarkers.forEach(m => map.removeLayer(m));
                    treeMarkers = [];

                    // Reîncărcare poziție hartă
                    if (importedData.center) {
                        map.setView(importedData.center, importedData.zoom || 19);
                    }

                    // Reîncărcare arbori
                    if (importedData.trees && Array.isArray(importedData.trees)) {
                        importedData.trees.forEach(t => {
                            addTreeMarker(t.lat, t.lng, t.data.speciesKey, t.data);
                        });
                    }

                    updateMicroclimateLayers();
                    alert("Proiect încărcat cu succes!");
                    toggleSidebar();
                } catch (err) {
                    alert("Fișierul JSON este invalid sau corupt: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        // Pornire aplicație la încărcarea paginii
        window.onload = initMap;
    </script>
</body>
</html>
