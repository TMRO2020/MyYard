<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Permacultura & Microclimat - Design Peisagistic</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- SunCalc JS pentru calcule astronomice solare precise -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --accent-color: #f59e0b;
            --bg-glass: rgba(255, 255, 255, 0.94);
            --text-main: #1a251b;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #map.planting-active {
            cursor: crosshair;
        }

        /* Buton Hamburger Dreapta-Sus */
        .hamburger-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: var(--bg-glass);
            border: 1px solid rgba(0, 0, 0, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--text-main);
            position: relative;
            transition: all 0.3s ease;
        }

        .hamburger-btn span::before,
        .hamburger-btn span::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            transition: all 0.3s ease;
        }

        .hamburger-btn span::before { top: -7px; }
        .hamburger-btn span::after { top: 7px; }

        /* Sidebar Panou Lateral */
        .sidebar {
            position: absolute;
            top: 0;
            right: -360px;
            width: 320px;
            height: 100%;
            background: var(--bg-glass);
            z-index: 1001;
            box-shadow: -4px 0 25px rgba(0,0,0,0.2);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            padding: 24px 20px;
            overflow-y: auto;
            color: var(--text-main);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-color);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            line-height: 1;
            color: #666;
            cursor: pointer;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #555;
            margin: 16px 0 8px 0;
            font-weight: 700;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #fff;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            background-color: var(--primary-hover);
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #4b5563;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid #ccc;
        }

        /* Toggle HTML */
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 0;
        }

        .toggle-group label {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Floating Toolbar */
        .toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-glass);
            padding: 10px 16px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            max-width: 95vw;
            flex-wrap: wrap;
            justify-content: center;
        }

        .toolbar select {
            border: 1px solid #ccc;
            background: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            max-width: 220px;
        }

        .btn-action {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.88rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-plant {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-stop-plant {
            background-color: #d32f2f;
            color: white;
            display: none;
        }

        .planting-badge {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: #d32f2f;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: var(--shadow);
            pointer-events: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
            100% { opacity: 0.8; }
        }

        /* Pop-up Leaflet */
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius);
            padding: 4px;
            box-shadow: var(--shadow);
        }

        .tree-popup {
            min-width: 240px;
            max-width: 280px;
            font-size: 0.88rem;
        }

        .tree-popup h3 {
            color: var(--primary-color);
            margin-bottom: 6px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        .tree-popup label {
            display: block;
            font-size: 0.78rem;
            color: #666;
            margin-top: 6px;
        }

        .tree-popup input {
            width: 100%;
            padding: 6px;
            margin-top: 2px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .knowledge-base {
            margin-top: 10px;
            padding: 8px;
            background-color: #f0f7f0;
            border-left: 3px solid var(--primary-color);
            border-radius: 4px;
            font-size: 0.78rem;
            color: #2d4a2e;
            line-height: 1.35;
        }

        .popup-actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            flex: 1;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-move {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-danger {
            background-color: #d32f2f;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Harta Principală -->
    <div id="map"></div>

    <!-- Indicator Mod Plantare -->
    <div class="planting-badge" id="planting-badge">
        🌱 Mod Plantare Activ: Apasă pe hartă pentru a plasa
    </div>

    <!-- Meniu Hamburger -->
    <div class="hamburger-btn" onclick="toggleSidebar()">
        <span></span>
    </div>

    <!-- Toolbar Plantare -->
    <div class="toolbar">
        <select id="species-select">
            <option value="">Se încarcă catalogul...</option>
        </select>

        <button class="btn-action btn-plant" id="btn-start-plant" onclick="startPlantingMode()">
            🌱 Plantare Copaci
        </button>

        <button class="btn-action btn-stop-plant" id="btn-stop-plant" onclick="stopPlantingMode()">
            ✅ Termină Plantarea
        </button>
    </div>

    <!-- Sidebar Meniu Configurare -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Setări & Microclimat</h2>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>

        <!-- Catalog Pepinieră Extern -->
        <div class="section-title">Catalog Pepinieră</div>
        <input type="file" id="catalogue-file" style="display: none;" accept=".json" onchange="importCatalogueJSON(event)">
        <button class="btn btn-outline" onclick="document.getElementById('catalogue-file').click()">
            📜 Încarcă Catalog Pepinieră (JSON)
        </button>

        <!-- Poziționare & GPS -->
        <div class="section-title">Poziționare</div>
        <button class="btn" onclick="getGPSLocation()">
            📍 Activează GPS
        </button>

        <div class="input-group">
            <input type="number" id="lat-input" step="any" placeholder="Latitudine">
            <input type="number" id="lng-input" step="any" placeholder="Longitudine">
        </div>
        <button class="btn btn-secondary" onclick="goToCustomCoords()">Mergi la coordonate</button>

        <!-- Favorit LocalStorage -->
        <div class="section-title">Locație Favorită</div>
        <div class="input-group">
            <button class="btn btn-outline" onclick="saveFavoriteLocation()">💾 Salvează Favorit</button>
            <button class="btn btn-outline" onclick="loadFavoriteLocation()">📂 Încarcă Favorit</button>
        </div>

        <!-- Overlays Microclimat -->
        <div class="section-title">Overlay Microclimat</div>
        <div class="toggle-group">
            <label for="solar-toggle">☀️ Strat Solar (Solstiții)</label>
            <label class="switch">
                <input type="checkbox" id="solar-toggle" onchange="toggleSolarLayer(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="toggle-group">
            <label for="wind-toggle">💨 Strat Vânturi Principale</label>
            <label class="switch">
                <input type="checkbox" id="wind-toggle" onchange="toggleWindLayer(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Import / Export Proiect -->
        <div class="section-title">Gestiune Proiect Teren</div>
        <button class="btn btn-outline" onclick="exportProjectJSON()">📥 Salvează Proiect (JSON)</button>
        <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importProjectJSON(event)">
        <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">📤 Încarcă Proiect (JSON)</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Obiect global dinamic populat din catalogue.json
        let SPECIES_CONFIG = {};

        // Stare Globală
        let map;
        let treeObjects = [];
        let isPlantingMode = false;
        let solarGroup = L.layerGroup();
        let windGroup = L.layerGroup();

        // Locație implicită (România)
        let currentCenter = [45.9432, 24.9668];

        // --- 1. ÎNCĂRCARE CATALOG EXTERN ---
        async function fetchDefaultCatalogue() {
            try {
                const response = await fetch('catalogue.json');
                if (response.ok) {
                    const catalogueData = await response.json();
                    parseAndLoadCatalogue(catalogueData);
                } else {
                    console.warn("Fișierul local catalogue.json nu a fost găsit. Folosește butonul de încărcare din meniu.");
                }
            } catch (err) {
                console.log("Notă: Încărcare catalog local neîncercată sau inaccesibilă fără web-server local.", err);
            }
        }

        function parseAndLoadCatalogue(jsonData) {
            SPECIES_CONFIG = {};
            const select = document.getElementById('species-select');
            select.innerHTML = '';

            jsonData.forEach(item => {
                const ec = item.cerinte_ecologice || {};
                const dim = item.dimensiuni_maturitate || {};

                SPECIES_CONFIG[item.id] = {
                    name: `${item.specie} ${item.soi}`,
                    color: item.culoare_harta || '#2e7d32',
                    defaultCrown: dim.diametru_coroana_m || 4.0,
                    defaultHeight: dim.inaltime_m || 3.0,
                    minDistance: item.distanta_minima_plantare_m || 4.0,
                    kb: `<b>Expunere soare:</b> ${ec.expunere_soare || 'Soare plin'}<br>` +
                        `<b>Pozitionare ideală:</b> ${ec.pozitionare_recomandata || 'Sud'}<br>` +
                        `<b>Rezistență vânt:</b> ${ec.sensibilitate_vant || 'Medie'}<br>` +
                        `<b>Distanță min. plantare:</b> ${item.distanta_minima_plantare_m || 4}m<br>` +
                        `<b>Îngrijire & Tratamente:</b> ${item.tratamente_si_ingrijire || '-'}`
                };

                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = `${item.specie} ${item.soi} (Coroană ~${dim.diametru_coroana_m || 4}m)`;
                select.appendChild(opt);
            });
        }

        function importCatalogueJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedCatalogue = JSON.parse(e.target.result);
                    parseAndLoadCatalogue(importedCatalogue);
                    alert("Catalogul de pomi a fost încărcat cu succes!");
                    toggleSidebar();
                } catch (err) {
                    alert("Eroare la citirea catalogului JSON: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        // --- 2. INIȚIALIZARE HARTA ---
        function initMap() {
            const savedFav = localStorage.getItem('perma_fav_location');
            if (savedFav) {
                currentCenter = JSON.parse(savedFav);
            }

            map = L.map('map', {
                zoomControl: false,
                tap: true
            }).setView(currentCenter, 19);

            L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                maxNativeZoom: 19,
                attribution: '&copy; Google Maps'
            }).addTo(map);

            map.on('move', updateMicroclimateLayers);

            map.on('click', function(e) {
                if (!isPlantingMode) return;
                if (e.originalEvent.target.classList.contains('leaflet-interactive')) return;
                
                const selectedSpecies = document.getElementById('species-select').value;
                if (!selectedSpecies) {
                    alert("Te rugăm să încarci mai întâi un catalog de pomi sau să selectezi un soi.");
                    return;
                }
                addTreeToMap(e.latlng.lat, e.latlng.lng, selectedSpecies);
            });

            fetchDefaultCatalogue();
            updateMicroclimateLayers();
        }

        // --- 3. MOD PLANTARE (START / STOP) ---
        function startPlantingMode() {
            isPlantingMode = true;
            document.getElementById('map').classList.add('planting-active');
            document.getElementById('btn-start-plant').style.display = 'none';
            document.getElementById('btn-stop-plant').style.display = 'inline-flex';
            document.getElementById('planting-badge').style.display = 'block';
        }

        function stopPlantingMode() {
            isPlantingMode = false;
            document.getElementById('map').classList.remove('planting-active');
            document.getElementById('btn-start-plant').style.display = 'inline-flex';
            document.getElementById('btn-stop-plant').style.display = 'none';
            document.getElementById('planting-badge').style.display = 'none';

            treeObjects.forEach(obj => {
                obj.marker.dragging.disable();
                updateMarkerVisualState(obj, false);
            });
        }

        // --- 4. PLANTARE COPAC + CERCL COROANĂ ÎN METRI ---
        function addTreeToMap(lat, lng, speciesKey, savedData = null) {
            const species = SPECIES_CONFIG[speciesKey] || {
                name: "Pom Nespecificat",
                color: "#2e7d32",
                defaultCrown: 4.0,
                defaultHeight: 3.0,
                kb: "Fără date suplimentare."
            };
            
            const treeData = savedData || {
                id: Date.now() + Math.random(),
                speciesKey: speciesKey,
                height: species.defaultHeight,
                crownDiameter: species.defaultCrown,
                age: 2
            };

            const crownRadius = treeData.crownDiameter / 2;
            const crownCircle = L.circle([lat, lng], {
                radius: crownRadius,
                color: species.color,
                fillColor: species.color,
                fillOpacity: 0.35,
                weight: 2,
                dashArray: isPlantingMode ? '4, 4' : null
            }).addTo(map);

            const centerIcon = L.divIcon({
                className: 'tree-center-point',
                html: `<div style="
                    background-color: ${species.color};
                    width: 14px;
                    height: 14px;
                    border-radius: 50%;
                    border: 2px solid #fff;
                    box-shadow: 0 0 4px rgba(0,0,0,0.6);
                "></div>`,
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            const marker = L.marker([lat, lng], {
                icon: centerIcon,
                draggable: isPlantingMode
            }).addTo(map);

            const treeObj = {
                id: treeData.id,
                treeData: treeData,
                marker: marker,
                crownCircle: crownCircle
            };

            bindTreePopup(treeObj);

            marker.on('drag', function(e) {
                const newPos = e.target.getLatLng();
                crownCircle.setLatLng(newPos);
            });

            marker.on('dragend', function(e) {
                const newPos = e.target.getLatLng();
                analizeazaCompatibilitateMediu(newPos.lat, newPos.lng, treeObj);
            });

            const enableMoveOnDblClick = function() {
                marker.dragging.enable();
                updateMarkerVisualState(treeObj, true);
                marker.openPopup();
            };

            marker.on('dblclick', enableMoveOnDblClick);
            crownCircle.on('dblclick', enableMoveOnDblClick);

            treeObjects.push(treeObj);
            analizeazaCompatibilitateMediu(lat, lng, treeObj);
        }

        function updateMarkerVisualState(treeObj, isMovable) {
            if (isMovable) {
                treeObj.crownCircle.setStyle({ dashArray: '6, 6', weight: 3 });
            } else {
                treeObj.crownCircle.setStyle({ dashArray: null, weight: 2 });
            }
        }

        function activateSingleMove(id) {
            const treeObj = treeObjects.find(t => t.id === id);
            if (treeObj) {
                treeObj.marker.dragging.enable();
                updateMarkerVisualState(treeObj, true);
                map.closePopup();
            }
        }

        // --- 5. FIȘĂ TEHNICĂ ȘI EDITARE ---
        function bindTreePopup(treeObj) {
            const data = treeObj.treeData;
            const species = SPECIES_CONFIG[data.speciesKey] || {};

            const popupContent = `
                <div class="tree-popup">
                    <h3>${species.name || 'Pom'}</h3>
                    
                    <label>Diametru coroană (metri pe teren):</label>
                    <input type="number" id="pop-crown-${data.id}" value="${data.crownDiameter}" step="0.5" min="0.5" oninput="updateTreeDiameter(${data.id})">

                    <label>Înălțime curentă (m):</label>
                    <input type="number" id="pop-height-${data.id}" value="${data.height}" step="0.5" onchange="updateTreeDetails(${data.id})">
                    
                    <label>Vârstă estimată (ani):</label>
                    <input type="number" id="pop-age-${data.id}" value="${data.age}" onchange="updateTreeDetails(${data.id})">

                    <div class="knowledge-base">
                        ${species.kb || 'Fără informații suplimentare.'}
                    </div>

                    <div class="popup-actions">
                        <button class="btn-small btn-move" onclick="activateSingleMove(${data.id})">✋ Mută Punctul</button>
                        <button class="btn-small btn-danger" onclick="deleteTree(${data.id})">🗑️ Șterge</button>
                    </div>
                </div>
            `;

            treeObj.marker.bindPopup(popupContent);
            treeObj.crownCircle.bindPopup(popupContent);
        }

        function updateTreeDiameter(id) {
            const treeObj = treeObjects.find(t => t.id === id);
            if (treeObj) {
                const val = parseFloat(document.getElementById(`pop-crown-${id}`).value) || 1;
                treeObj.treeData.crownDiameter = val;
                treeObj.crownCircle.setRadius(val / 2);
            }
        }

        function updateTreeDetails(id) {
            const treeObj = treeObjects.find(t => t.id === id);
            if (treeObj) {
                treeObj.treeData.height = parseFloat(document.getElementById(`pop-height-${id}`).value) || 0;
                treeObj.treeData.age = parseInt(document.getElementById(`pop-age-${id}`).value) || 0;
            }
        }

        function deleteTree(id) {
            const index = treeObjects.findIndex(t => t.id === id);
            if (index !== -1) {
                map.removeLayer(treeObjects[index].marker);
                map.removeLayer(treeObjects[index].crownCircle);
                treeObjects.splice(index, 1);
            }
        }

        // --- 6. MENIU & STRATURI MICROCLIMAT ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function getGPSLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 19);
                    updateMicroclimateLayers();
                    toggleSidebar();
                }, function(error) {
                    alert("Eroare GPS: " + error.message);
                }, { enableHighAccuracy: true });
            }
        }

        function goToCustomCoords() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                map.setView([lat, lng], 19);
                updateMicroclimateLayers();
                toggleSidebar();
            }
        }

        function saveFavoriteLocation() {
            const center = map.getCenter();
            localStorage.setItem('perma_fav_location', JSON.stringify([center.lat, center.lng]));
            alert("Locația a fost salvată ca favorită!");
        }

        function loadFavoriteLocation() {
            const savedFav = localStorage.getItem('perma_fav_location');
            if (savedFav) {
                map.setView(JSON.parse(savedFav), 19);
                toggleSidebar();
            }
        }

        function toggleSolarLayer(enable) {
            if (enable) solarGroup.addTo(map);
            else { solarGroup.clearLayers(); map.removeLayer(solarGroup); }
            updateMicroclimateLayers();
        }

        function toggleWindLayer(enable) {
            if (enable) windGroup.addTo(map);
            else { windGroup.clearLayers(); map.removeLayer(windGroup); }
            updateMicroclimateLayers();
        }

        function updateMicroclimateLayers() {
            const center = map.getCenter();
            
            if (map.hasLayer(solarGroup)) {
                solarGroup.clearLayers();
                const summerSolstice = new Date(new Date().getFullYear(), 5, 21);
                const winterSolstice = new Date(new Date().getFullYear(), 11, 21);

                const summerSun = SunCalc.getTimes(summerSolstice, center.lat, center.lng);
                const winterSun = SunCalc.getTimes(winterSolstice, center.lat, center.lng);

                drawSolarRay(center, SunCalc.getPosition(summerSun.sunrise, center.lat, center.lng).azimuth, '#f59e0b', 'Răsărit Solstițiu Vară');
                drawSolarRay(center, SunCalc.getPosition(summerSun.sunset, center.lat, center.lng).azimuth, '#d97706', 'Apus Solstițiu Vară');
                drawSolarRay(center, SunCalc.getPosition(winterSun.sunrise, center.lat, center.lng).azimuth, '#3b82f6', 'Răsărit Solstițiu Iarnă');
                drawSolarRay(center, SunCalc.getPosition(winterSun.sunset, center.lat, center.lng).azimuth, '#1d4ed8', 'Apus Solstițiu Iarnă');
            }

            if (map.hasLayer(windGroup)) {
                windGroup.clearLayers();
                drawWindArrow(center, 45, '#1e3a8a', 'Crivăț (NE)');
                drawWindArrow(center, 225, '#ef4444', 'Vânt Cald (SV)');
            }
        }

        function drawSolarRay(center, azimuthRad, color, labelText) {
            const distance = 0.0008;
            const destLat = center.lat + (distance * Math.cos(azimuthRad));
            const destLng = center.lng + (distance * Math.sin(azimuthRad));

            const line = L.polyline([[center.lat, center.lng], [destLat, destLng]], {
                color: color, weight: 3, dashArray: '6, 6', opacity: 0.85
            }).addTo(solarGroup);
            line.bindTooltip(labelText, { permanent: false, direction: 'top' });
        }

        function drawWindArrow(center, angleDegrees, color, labelText) {
            const rad = (angleDegrees - 90) * (Math.PI / 180);
            const distance = 0.0006;
            const destLat = center.lat + (distance * Math.sin(rad));
            const destLng = center.lng + (distance * Math.cos(rad));

            const line = L.polyline([[center.lat, center.lng], [destLat, destLng]], {
                color: color, weight: 4, opacity: 0.75
            }).addTo(windGroup);
            line.bindTooltip(labelText, { permanent: false, direction: 'center' });
        }

        // --- 8. EXPORT / IMPORT JSON PROIECT ---
        function exportProjectJSON() {
            const exportData = {
                version: "2.1",
                timestamp: new Date().toISOString(),
                center: [map.getCenter().lat, map.getCenter().lng],
                zoom: map.getZoom(),
                trees: treeObjects.map(t => ({
                    lat: t.marker.getLatLng().lat,
                    lng: t.marker.getLatLng().lng,
                    data: t.treeData
                }))
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `proiect_permacultura_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importProjectJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);

                    treeObjects.forEach(t => {
                        map.removeLayer(t.marker);
                        map.removeLayer(t.crownCircle);
                    });
                    treeObjects = [];

                    if (importedData.center) {
                        map.setView(importedData.center, importedData.zoom || 19);
                    }

                    if (importedData.trees && Array.isArray(importedData.trees)) {
                        importedData.trees.forEach(t => {
                            addTreeToMap(t.lat, t.lng, t.data.speciesKey, t.data);
                        });
                        stopPlantingMode();
                    }

                    updateMicroclimateLayers();
                    alert("Proiectul a fost încărcat pe teren!");
                    toggleSidebar();
                } catch (err) {
                    alert("Fișier JSON invalid: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        window.onload = initMap;
