<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificator Plantare Pepinieră</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #eef2f5;
            border-radius: 6px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            font-size: 0.85em;
            margin-bottom: 5px;
            text-transform: uppercase;
            color: #555;
        }
        select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95em;
        }
        select:disabled {
            background-color: #e0e0e0;
            cursor: not-allowed;
        }
        .info-card {
            border: 1px solid #ddd;
            border-left: 5px solid #2e7d32;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
            margin-top: 15px;
        }
        .info-card h3 {
            margin-top: 0;
            color: #2e7d32;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 0.8em;
            font-weight: bold;
            color: #fff;
            border-radius: 3px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Planificator Plantare - Selecție Pepinieră</h2>

    <div class="control-panel">
        <div class="form-group">
            <label for="selectCategorie">1. Categorie</label>
            <select id="selectCategorie" disabled>
                <option value="">-- Se încarcă catalogul... --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="selectSpecie">2. Specie</label>
            <select id="selectSpecie" disabled>
                <option value="">-- Alege Specia --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="selectSoi">3. Soi / Varietate</label>
            <select id="selectSoi" disabled>
                <option value="">-- Alege Soiul --</option>
            </select>
        </div>
    </div>

    <div id="detailsPanel" class="info-card" style="display: none;">
        <h3 id="plantTitle">Nume Plantă</h3>
        <p><strong>Distanță minimă de plantare:</strong> <span id="plantDistance">-</span> m</p>
        <p><strong>Dimensiuni la maturitate:</strong> Înălțime <span id="plantHeight">-</span> m | Diametru coroană <span id="plantCrown">-</span> m</p>
        <p><strong>Expunere soare:</strong> <span id="plantSun">-</span></p>
        <p><strong>Sensibilitate vânt:</strong> <span id="plantWind">-</span></p>
        <p><strong>Poziționare recomandată:</strong> <span id="plantPos">-</span></p>
        <p><strong>Îngrijire și tratamente:</strong> <span id="plantCare">-</span></p>
    </div>
</div>

<script>
    let catalogData = null;

    const selectCategorie = document.getElementById('selectCategorie');
    const selectSpecie = document.getElementById('selectSpecie');
    const selectSoi = document.getElementById('selectSoi');
    const detailsPanel = document.getElementById('detailsPanel');

    const categoryLabels = {
        "pomi_fructiferi": "Pomi Fructiferi",
        "arbusti_fructiferi": "Arbuști Fructiferi",
        "vita_de_vie": "Viță de Vie"
    };

    // Încarcă automat catalogue.json la pornirea aplicației
    window.addEventListener('DOMContentLoaded', () => {
        fetch('catalogue.json')
            .then(response => {
                if (!response.ok) throw new Error("Nu s-a putut încărca catalogue.json");
                return response.json();
            })
            .then(data => {
                catalogData = data;
                initCategorySelect();
            })
            .catch(err => {
                console.error(err);
                selectCategorie.innerHTML = '<option value="">Eroare la încărcarea catalogului</option>';
            });
    });

    function initCategorySelect() {
        selectCategorie.innerHTML = '<option value="">-- Alege Categoria --</option>';
        selectSpecie.innerHTML = '<option value="">-- Alege Specia --</option>';
        selectSoi.innerHTML = '<option value="">-- Alege Soiul --</option>';

        Object.keys(catalogData).forEach(catKey => {
            if (catalogData[catKey].length > 0) {
                const opt = document.createElement('option');
                opt.value = catKey;
                opt.textContent = categoryLabels[catKey] || catKey;
                selectCategorie.appendChild(opt);
            }
        });

        selectCategorie.disabled = false;
    }

    selectCategorie.addEventListener('change', function() {
        const selectedCat = this.value;
        selectSpecie.innerHTML = '<option value="">-- Alege Specia --</option>';
        selectSoi.innerHTML = '<option value="">-- Alege Soiul --</option>';
        selectSoi.disabled = true;
        detailsPanel.style.display = 'none';

        if (!selectedCat || !catalogData[selectedCat]) {
            selectSpecie.disabled = true;
            return;
        }

        catalogData[selectedCat].forEach((item, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = item.specie;
            selectSpecie.appendChild(opt);
        });

        selectSpecie.disabled = false;
    });

    selectSpecie.addEventListener('change', function() {
        const selectedCat = selectCategorie.value;
        const specieIndex = this.value;

        selectSoi.innerHTML = '<option value="">-- Alege Soiul --</option>';
        detailsPanel.style.display = 'none';

        if (specieIndex === "" || !catalogData[selectedCat][specieIndex]) {
            selectSoi.disabled = true;
            return;
        }

        const soiuriList = catalogData[selectedCat][specieIndex].soiuri;
        soiuriList.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.soi;
            selectSoi.appendChild(opt);
        });

        selectSoi.disabled = false;
    });

    selectSoi.addEventListener('change', function() {
        const selectedCat = selectCategorie.value;
        const specieIndex = selectSpecie.value;
        const soiId = this.value;

        if (!soiId) {
            detailsPanel.style.display = 'none';
            return;
        }

        const soiObj = catalogData[selectedCat][specieIndex].soiuri.find(s => s.id === soiId);
        if (soiObj) {
            renderDetails(soiObj, catalogData[selectedCat][specieIndex].specie);
        }
    });

    function renderDetails(data, specieName) {
        document.getElementById('plantTitle').innerHTML = `${specieName} - ${data.soi} <span class="badge" style="background-color: ${data.culoare_harta}">${data.culoare_harta}</span>`;
        document.getElementById('plantDistance').textContent = data.distanta_minima_plantare_m;
        document.getElementById('plantHeight').textContent = data.dimensiuni_maturitate.inaltime_m;
        document.getElementById('plantCrown').textContent = data.dimensiuni_maturitate.diametru_coroana_m;
        document.getElementById('plantSun').textContent = data.cerinte_ecologice.expunere_soare;
        document.getElementById('plantWind').textContent = data.cerinte_ecologice.sensibilitate_vant;
        document.getElementById('plantPos').textContent = data.cerinte_ecologice.pozitionare_recomandata;
        document.getElementById('plantCare').textContent = data.tratamente_si_ingrijire;

        detailsPanel.style.display = 'block';
    }
</script>

</body>
</html>
