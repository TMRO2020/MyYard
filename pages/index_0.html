<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS Refresh — WATCH</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,sans-serif;overflow:hidden;background:#111}
#map{position:absolute;inset:0}
#panel{position:absolute;z-index:1000;top:8px;left:8px;right:8px;padding:9px 10px;border-radius:10px;background:rgba(0,0,0,.80);color:#fff;font-size:13px;line-height:1.4;max-height:50vh;overflow:auto}
button,a.btn{border:0;border-radius:7px;padding:8px 10px;margin:2px;background:#eee;color:#111;font-weight:700;text-decoration:none;display:inline-block}
button.stop{background:#b00020;color:#fff}
button.active{background:#1479ff;color:#fff}
.stat{margin-top:5px;font-size:12px}.muted{opacity:.8}
</style></head><body><div id="map"></div>
<div id="panel"><b>🔵 TEST 0 — WATCH</b><br><span class="muted">Pagină independentă. Fără tracking-ul Orchard.</span><br>
<button id="start" class="active">▶ START WATCH</button><button id="stop" class="stop">■ STOP</button><button id="clear">Șterge</button><a class="btn" href="../index.html">← Meniu</a>
<button id="googleBtn">Google</button><button id="esriBtn">Esri</button><button id="gridBtn">▦ Grid 1×1 m: OFF</button>
<div class="stat">Callback-uri: <span id="cb">0</span> · Poziții noi: <span id="new">0</span> · Mișcări ≥10 cm: <span id="mv">0</span></div>
<div class="stat">Interval callback: <span id="dt">—</span> ms · minim: <span id="min">—</span> ms · schimbare poziție: <span id="newdt">—</span> ms</div>
<div class="stat">Ultima deplasare: <span id="dist">—</span> m · accuracy: <span id="acc">—</span></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:true,minZoom:16,maxZoom:23,zoomSnap:1,zoomDelta:1,wheelPxPerZoomLevel:80,tap:true,preferCanvas:true}).setView([45.1,26.7],19);
const google=L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{minZoom:16,maxZoom:23,maxNativeZoom:19,attribution:'&copy; Google'}).addTo(map);
const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{minZoom:16,maxZoom:19,maxNativeZoom:19,attribution:'Tiles &copy; Esri'});
let grid=L.layerGroup().addTo(map),gridOn=false,gridOrigin=null;
function provider(p){
 if(map.hasLayer(google))map.removeLayer(google);if(map.hasLayer(esri))map.removeLayer(esri);
 (p==='google'?google:esri).addTo(map);
}
googleBtn.onclick=()=>provider('google');esriBtn.onclick=()=>provider('esri');
gridBtn.onclick=()=>{gridOn=!gridOn;if(gridOn&&!gridOrigin){const c=map.getCenter();gridOrigin={lat:c.lat,lon:c.lng}};gridBtn.textContent='▦ Grid 1×1 m: '+(gridOn?'ON':'OFF');drawGrid()};
function drawGrid(){
 grid.clearLayers();if(!gridOn||!gridOrigin||map.getZoom()<18)return;
 const b=map.getBounds(),lat0=gridOrigin.lat,lon0=gridOrigin.lon,mLat=111320,mLon=111320*Math.cos(lat0*Math.PI/180);
 const xmin=Math.floor((b.getWest()-lon0)*mLon),xmax=Math.ceil((b.getEast()-lon0)*mLon),ymin=Math.floor((b.getSouth()-lat0)*mLat),ymax=Math.ceil((b.getNorth()-lat0)*mLat);
 if((xmax-xmin)+(ymax-ymin)>1200)return;
 for(let x=xmin;x<=xmax;x++){const lon=lon0+x/mLon;L.polyline([[b.getSouth(),lon],[b.getNorth(),lon]],{color:'#00d9ff',weight:x%10===0?1.2:.7,opacity:.55,interactive:false}).addTo(grid)}
 for(let y=ymin;y<=ymax;y++){const lat=lat0+y/mLat;L.polyline([[lat,b.getWest()],[lat,b.getEast()]],{color:'#00d9ff',weight:y%10===0?1.2:.7,opacity:.55,interactive:false}).addTo(grid)}
}
map.on('moveend zoomend',drawGrid);

let id=null,lastT=null,lastNewT=null,minDt=null,lastLat=null,lastLon=null,cb=0,nw=0,mv=0,marker=null,path=L.layerGroup().addTo(map);
function d(a,b,c,e){const R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(e-b)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function got(p){const now=performance.now(),c=p.coords,lat=c.latitude,lon=c.longitude;cb++;document.getElementById('cb').textContent=cb;
if(lastT!==null){let x=now-lastT;document.getElementById('dt').textContent=x.toFixed(0);if(minDt===null||x<minDt){minDt=x;document.getElementById('min').textContent=x.toFixed(0)}}lastT=now;
let dist=lastLat===null?null:d(lastLat,lastLon,lat,lon);if(dist!==null){document.getElementById('dist').textContent=dist.toFixed(3);if(dist>=.10)mv++;document.getElementById('mv').textContent=mv}
if(lastLat===null||dist>=0.01){nw++;document.getElementById('new').textContent=nw;if(lastNewT!==null)document.getElementById('newdt').textContent=(now-lastNewT).toFixed(0);lastNewT=now}
lastLat=lat;lastLon=lon;document.getElementById('acc').textContent=Number.isFinite(c.accuracy)?c.accuracy.toFixed(2)+' m':'—';
if(!marker){marker=L.circleMarker([lat,lon],{radius:7,color:'#fff',weight:2,fillColor:'#168cff',fillOpacity:.95}).addTo(map);map.setView([lat,lon],Math.max(map.getZoom(),19))}else marker.setLatLng([lat,lon]);
L.circleMarker([lat,lon],{radius:3,color:'#fff',weight:1,fillColor:'#168cff',fillOpacity:.75}).addTo(path)}
start.onclick=()=>{if(id===null){id=navigator.geolocation.watchPosition(got,e=>alert('Geolocation error '+e.code),{enableHighAccuracy:true,maximumAge:0,timeout:5000});start.textContent='● WATCH ON'}};
stop.onclick=()=>{if(id!==null){navigator.geolocation.clearWatch(id);id=null};start.textContent='▶ START WATCH'};
clear.onclick=()=>{stop.click();path.clearLayers();if(marker){map.removeLayer(marker);marker=null};cb=nw=mv=0;lastT=lastNewT=minDt=lastLat=lastLon=null;['cb','new','mv'].forEach(x=>document.getElementById(x).textContent='0');['dt','min','newdt','dist','acc'].forEach(x=>document.getElementById(x).textContent='—')};
</script></body></html>
